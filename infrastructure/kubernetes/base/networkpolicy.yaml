# Politique réseau MEDISUITE (v0.15) — DENY par défaut, allowlist minimale.
# Modèle : rien n'entre ni ne sort du namespace sauf :
#   1. intra-namespace (services ↔ services, scraping Prometheus, OTel) ;
#   2. DNS sortant vers kube-system (UDP/TCP 53) ;
#   3. entrée publique UNIQUEMENT vers l'api-gateway depuis l'ingress
#      controller (les 38 autres services restent inatteignables de l'extérieur).
# Le transformer `namespace:` des overlays réécrit metadata.namespace sur
# chacune de ces politiques (dev/staging/prod) — aucune duplication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-in-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway
spec:
  podSelector:
    matchLabels: {app: api-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8000}
