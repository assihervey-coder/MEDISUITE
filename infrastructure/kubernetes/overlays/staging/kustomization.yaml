apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medisuite-staging
resources: [../../base]
# Staging : réplique unique par service, données jetables, images `edge`
# (branche main) publiées sur GHCR par le job docker-publish de la CI.
patches: [{path: replicas.yaml, target: {kind: Deployment}}]
