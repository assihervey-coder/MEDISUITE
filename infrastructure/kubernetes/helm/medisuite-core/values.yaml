replicaCount: 2
# Images publiées par le job CI docker-publish (tag = version semver) :
# ghcr.io/assihervey-coder/medisuite/medisuite-<service>:<version>
image: {repository: ghcr.io/assihervey-coder/medisuite, tag: 0.15.0}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
