name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  clinical-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q fastapi uvicorn sqlalchemy httpx pytest pyyaml numpy
      - name: Moteur de règles cliniques
        run: cd packages/clinical-rules && python -m pytest tests/ -q
      - name: Fusion multimodale
        run: cd ai && python -m pytest multimodal/tests/ -q

  packages-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q fastapi uvicorn sqlalchemy httpx pytest pyyaml numpy
      - name: Noyau medisuite-core + datasets
        run: python -m pytest packages/medisuite-core/tests/ datasets/tests/ -q
      - name: Tests d'intégration (HAPI FHIR / OTel / IOP)
        run: python -m pytest services/integration-service/tests/ -q
      - name: Outils transverses (model-cards)
        run: python -m pytest tools/tests/ -q
      - name: Control Plane d'évolution (governance V1)
        run: python -m pytest evolution-control-plane/tests/ -q
      - name: Idempotence des model-cards (dérive = échec)
        run: python tools/generate_model_cards.py --check
      - name: Idempotence des écrans fins (dérive = échec)
        run: python tools/generate_screens.py --check

  services:
    runs-on: ubuntu-latest
    needs: clinical-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q fastapi uvicorn sqlalchemy httpx pytest pyyaml numpy
      - run: python services/run_tests.py

  e2e-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd apps/web-portal && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Navigateur Chromium (Playwright)
        run: cd apps/web-portal && npx playwright install --with-deps chromium
      - name: Parcours e2e (APIs mockées)
        run: cd apps/web-portal && npx playwright test

  web-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd apps/web-portal && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Type-check strict (aucun échec toléré)
        run: cd apps/web-portal && npx tsc -b --force

  docker-publish:
    runs-on: ubuntu-latest
    needs: [clinical-rules, packages-integration]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, auth-service, patient-service, imaging-service, laboratory-service, ecrf-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/medisuite-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: local-deployment/Dockerfile.service
          push: true
          build-args: |
            SERVICE_DIR=services/${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
