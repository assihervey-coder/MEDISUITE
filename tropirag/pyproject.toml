[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tropirag"
version = "0.1.0"
description = "TropiRAG — Compagnon clinique de terrain (fièvre + voyage, Afrique de l'Ouest). AI Model Mesh + autorité clinique déterministe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TropiRAG Team" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "httpx>=0.26",
]

[project.optional-dependencies]
api = ["uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tropirag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "clinical: tests cliniques (cas réels synthétisés)",
    "safety: tests de sécurité (red flags, refus)",
    "adversarial: tests adversariaux (injection, hallucination)",
]

[tool.coverage.run]
source = ["src/tropirag"]
