section: Contexte national ivoirien
text: La Côte d'Ivoire est un pays à transmission palustre intense et permanente (holoendémie). Le protocole
  national recommande le TDR systématique devant toute fièvre, la CTA (artéméther-luméfantrine) pour le
  paludisme simple et l'artésunate injectable pour les formes sévères, avec gratuité du TDR dans les formations
  sanitaires publiques.
