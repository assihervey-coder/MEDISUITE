section: Paludisme et drépanocytose
text: 'Le paludisme chez le patient drépanocytaire est plus fréquent et plus sévère : il déclenche
  ou aggrave les crises hémolytiques, majore le risque d''anémie sévère nécessitant une transfusion
  et de syndrome thoracique aigu. Toute fièvre chez un drépanocytaire en zone d''endémie exige
  un test paludique immédiat (TDR ou microscopie) et un traitement antipaludique sans délai si positif.'
