section: Paludisme cérébral
text: 'Le neuropaludisme (coma persistant après correction de l''hypoglycémie ou des convulsions, avec
  parasitémie) est une urgence vitale : artésunate IV immédiat, contrôle glycémique, position latérale
  de sécurité, exclusion des autres causes de coma. La mortalité résiduelle reste de 10 à 20 % même traité.'
