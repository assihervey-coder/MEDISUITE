source_id: msf-malaria-guidelines
section: Paludisme en contexte MSF
text: En zone d'endémie, la stratégie MSF combine dépistage communautaire, TDR à la périphérie et prise
  en charge du paludisme simple par CTA. Chez la femme enceinte, tout épisode fébrile doit être testé
  et traité rapidement (risque d'anémie maternelle et de faible poids de naissance). Chez le nourrisson
  de moins de 12 mois, l'évaluation hospitalière est privilégiée.
