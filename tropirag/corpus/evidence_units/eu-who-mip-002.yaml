section: Traitement antipaludique pendant la grossesse
text: 'Les combinaisons à base d''artémisinine (CTA), dont l''artéméther-luméfantrine, peuvent être
  utilisées pendant tous les trimestres de la grossesse. Dans le paludisme sévère de la femme
  enceinte, l''artésunate IV est préféré à la quinine : il est plus efficace et la quinine expose
  à l''hypoglycémie maternelle. La primaquine est contre-indiquée pendant toute la grossesse ;
  la sulfadoxine-pyriméthamine (IPTp) ne s''administre qu''à partir du deuxième trimestre.'
