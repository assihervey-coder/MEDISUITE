source_id: msf-dengue
section: Gestion terrain MSF
text: 'La surveillance en phase critique (défervescence) est l''élément central : recherche quotidienne
  des signes d''alarme, hématocrite et plaquettes. Le remplissage est réservé à la fuite plasmatique avec
  choc, prudent et réévalué (risque de surcharge). Aucun antibiotique n''est indiqué. Éducation du patient
  et de l''entourage aux signes de retour immédiat.'
