source_id: who-dengue-2024
section: Dengue chez la femme enceinte
text: 'La dengue pendant la grossesse expose à un risque accru de forme sévère maternelle et de
  transmission verticale en période périnatale. Toute femme enceinte avec dengue confirmée ou
  suspectée nécessite une surveillance rapprochée de la numération et des signes d''alarme,
  un accouchement planifié en structure équipée, et l''équipe obstétricale-néonatale doit être
  informée du risque d''hémorragie et de dengue néonatale.'
