section: Paludisme sévère de la femme enceinte
text: 'Le paludisme sévère de la femme enceinte est une urgence obstétricale et médicale : risque
  d''hypoglycémie, d''œdème pulmonaire, d''anémie sévère, de détresse fœtale et d''accouchement
  prématuré. La prise en charge associe artésunate IV, surveillance glycémique rapprochée,
  évaluation obstétricale conjointe et orientation vers une structure avec capacité de
  réanimation et de soins néonatals.'
