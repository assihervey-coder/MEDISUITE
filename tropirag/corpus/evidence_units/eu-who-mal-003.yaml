section: Traitement du paludisme simple
text: Le traitement du paludisme simple à P. falciparum repose sur les combinaisons à base d'artémisinine
  (CTA), notamment l'artéméther-luméfantrine, pris avec un aliment ou du lait pour améliorer l'absorption.
  Le traitement doit être complet (généralement 3 jours). En cas de vomissement dans l'heure suivant la
  prise, réadministrer la dose.
