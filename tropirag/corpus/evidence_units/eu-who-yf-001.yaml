section: Fièvre jaune
text: La fièvre jaune débute brutalement par fièvre, céphalées, myalgies et lombalgies avec nausées. La
  phase toxique (environ 15 % des cas après une rémission brève) associe ictère, hémorragies (vomissements
  noirs, épistaxis, gingivorragies), insuffisance rénale et troubles de la conscience ; la létalité atteint
  30 à 60 % dans les formes ictéro-hémorragiques. C'est une maladie à déclaration internationale obligatoire
  (RSI 2005).
