text: 'Les signes d''alarme imposent une réévaluation immédiate : douleurs abdominales
  intenses ou sensibilité de l''hypochondre droit, vomissements persistants, saignement
  des gencives ou du nez, léthargie ou agitation, hémoconcentration, éruption avec
  pétéchies, et foie augmenté de volume. Chez l''enfant, la soif intense et les pleurs
  sans larmes signalent la déshydratation.'
