text: La présentation classique associe fièvre, frissons, sueurs et céphalées. Chez
  l'enfant, la fièvre peut être isolée. Les vomissements sont fréquents et peuvent
  gêner le traitement oral. Les douleurs musculaires et la fatigue complètent le tableau.
  Toute fièvre au retour d'une zone d'endémie doit faire évoquer un paludisme jusqu'à
  preuve du contraire.
