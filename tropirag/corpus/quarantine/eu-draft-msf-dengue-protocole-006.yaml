text: 'L''hypovolémie doit être corrigée prudemment : un remplissage vasculaire excessif
  peut précéder une surcharge pulmonaire iatrogène. La surveillance est horaire pendant
  la phase critique : diurèse, tension artérielle, hématocrite. Le choc décompensé
  relève d''un remplissage prudent puis des vasopresseurs en soins intensifs. Le transfert
  vers un hôpital de référence doit être décidé dès les premiers signes d''alarme
  chez l''enfant. Document de travail - ne pas distribuer hors du protocole interne.'
