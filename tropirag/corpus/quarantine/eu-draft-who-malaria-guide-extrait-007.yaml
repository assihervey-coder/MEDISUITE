text: Chez la femme enceinte, le paludisme à P. falciparum est une urgence thérapeutique
  quelle que soit la densité parasitaire. Le traitement de référence est l'artésunate
  IV, préféré à la quinine en raison d'une tolérance meilleure et d'une efficacité
  supérieure. Le sulfadoxinepyriméthamine est contre-indiqué au premier trimestre.
  Les AINS sont déconseillés au troisième trimestre.
