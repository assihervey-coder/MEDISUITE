text: Le paludisme est une parasitose due aux hématozoaires du genre Plasmodium, transmis
  par la piqûre de l'anophèle femelle. En Afrique de l'Ouest, Plasmodium falciparum
  est responsable de la grande majorité des cas et potentiellement des formes graves.
  L'incubation habituelle est de 7 à 30 jours après la piqûre infectante.
