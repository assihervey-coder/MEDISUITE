text: En cas de sejour dans un pays a haut risque XDR, l'azithromycine orale est recommandee
  en premiere intention pour les formes non compliquees. Les fluoroquinolones sont
  contre-indiquees, ainsi que les cephalosporines de troisieme generation orales comme
  la cefixime, en cas de XDR confirmee. Les formes graves, avec perforation digestive
  ou choc septique, relèvent du meropeneme intraveineux en milieu hospitalier.
