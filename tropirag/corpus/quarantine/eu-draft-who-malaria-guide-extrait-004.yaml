text: 'Le paludisme sévère est une urgence vitale thérapeutique. Les critères de gravité
  comprennent : troubles de la conscience ou coma, convulsions répétées, anémie sévère,
  ictère, oligurie ou insuffisance rénale, détresse respiratoire, hypoglycémie, et
  hyperparasitémie. La présence d''un seul critère impose l''hospitalisation immédiate
  en soins critiques. Le traitement de première intention est l''artésunate par voie
  intraveineuse : il doit être administré immédiatement, sans attendre la confirmation
  parasitologique chez le patient critique.'
