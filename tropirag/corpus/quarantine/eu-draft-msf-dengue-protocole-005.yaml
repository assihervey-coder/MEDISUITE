text: Le diagnostic repose sur la recherche du virus NS1 dans les cinq premiers jours,
  puis sur la sérologie IgM/IgG. La thrombopénie inférieure à 100 giga/litres et l'hémoconcentration
  sont des signes biologiques d'orientation. La numération formule sanguine doit être
  répétée quotidiennement jusqu'à la sortie de la phase critique.
