text: La dengue est une arbovirose transmise par les moustiques Aedes, endémique en
  Côte d'Ivoire pendant et après la saison des pluies. L'incubation est de 4 à 10
  jours. La forme sévère survient typiquement entre le 3e et le 7e jour, au moment
  de la défervescence.
