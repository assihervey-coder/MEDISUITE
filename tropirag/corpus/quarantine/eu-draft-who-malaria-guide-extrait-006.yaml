source_id: who-malaria-guide-extrait
text: Le paludisme simple à P. falciparum non compliqué se traite par combinaison
  à base d'artémisinine (CTA) en cure de trois jours. Le paludisme sévère relève de
  l'artésunate IV pendant au moins 24 heures, relayé par un traitement oral complet
  dès l'amélioration. La quinine IV reste une alternative en cas d'indisponibilité
  de l'artésunate. La primaquine, utilisée pour les formes à P. vivax ou ovale, est
  contre-indiquée chez la femme enceinte et en cas de déficit en G6PD.
