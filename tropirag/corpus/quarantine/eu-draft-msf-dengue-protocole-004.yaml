source_id: msf-dengue-protocole
text: Les AINS, dont l'ibuprofène et l'aspirine, sont contre-indiqués dans la dengue
  suspectée en raison du risque hémorragique et du syndrome de Reye chez l'enfant.
  Le paracétamol est le seul antipyrétique recommandé, à dose espacée. Aucune corticothérapie
  n'est indiquée.
