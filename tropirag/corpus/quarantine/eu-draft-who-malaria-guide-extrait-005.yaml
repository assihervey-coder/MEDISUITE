source_id: who-malaria-guide-extrait
text: 'Le diagnostic repose sur le test de diagnostic rapide (TDR) détectant les antigènes
  spécifiques, et sur la goutte épaisse avec frottis mince, qui permettent la confirmation
  parasitologique et la mesure de la parasitémie. Un TDR négatif n''élimine pas le
  paludisme si la clinique est évocatrice : le test doit être répété, et la goutte
  épaisse réalisée. Chez la femme enceinte, le paludisme peut être pauci-symptomatique
  mais expose au risque d''anémie maternelle et de faible poids de naissance.'
