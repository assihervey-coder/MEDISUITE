text: La prévention associe moustiquaires imprégnées d'insecticide, prophylaxie médicamenteuse
  pour les voyageurs non immuns, et lutte antivectorielle. La chimioprévention du
  paludisme saisonnier est recommandée chez les enfants de moins de 5 ans dans les
  zones de forte transmission saisonnière.
