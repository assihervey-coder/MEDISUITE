text: Fixture interne de test TropiRAG - 20/10/2023 - Abidjan, Cote d'Ivoire Le Centre
  de coordination note la circulation continue de souches de Salmonella Typhi resistantes
  aux antibiotiques de reference dans le sous-continent indien, avec extension documentee
  vers l'Afrique de l'Est. Les voyageurs au retour du Pakistan et de l'Afghanistan
  doivent etre consideres comme exposes a la fièvre typhoide XDR jusqu'a preuve du
  contraire.
