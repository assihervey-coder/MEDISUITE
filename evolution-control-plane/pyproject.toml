[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medisuite-evolution-control-plane"
version = "1.0.0"
description = "Control Plane d'évolution MEDISUITE — gouvernance PROPOSITION→PREUVE"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "fastapi>=0.110", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = { find = { where = [".."], include = ["evolution-control-plane*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
