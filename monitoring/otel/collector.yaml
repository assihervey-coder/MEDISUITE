# OpenTelemetry Collector — configuration MEDISUITE (v0.4)
# Reçoit les spans OTLP des 38 services (OTLP/gRPC 4317, OTLP/HTTP 4318),
# applique les processors de ressources et de lots, puis :
#   - exporte des métriques de traces vers Prometheus (port 8889, job "otel")
#   - journalise les traces en debug (opérateur : grep dans docker logs)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 128
  resource/medisuite:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
      - key: medisuite.namespace
        value: medisuite.v0.4
        action: upsert
  memory_limiter:
    check_interval: 2s
    limit_mib: 512

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true   # service.name devient un label Prometheus
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/medisuite, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/medisuite, batch]
      exporters: [prometheus]
