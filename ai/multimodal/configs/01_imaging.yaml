# Module 01 — imaging
# Fusion multimodale : Détection d'anomalies image par image
task: classification
d_model: 32
seed: 42
backend: numpy              # ADR 0022 : numpy | torch | monai
modalities:
  attendues: ['imaging_2d', 'imaging_3d', 'tabulaire']
  politique_modalites_manquantes: degrade_elegamment  # ADR-0018
heads:
  shared_trunk: true      # ADR-0019 : multi-tâches sur tronc partagé
losses:
  weighting: uncertainty  # pondération par incertitude
explainability:
  modality_importance: true
  attention_viz: true
  shap_multimodal: v0.2
