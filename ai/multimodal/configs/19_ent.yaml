# Module 19 — ent
# Fusion multimodale : Perte auditive évolutive
task: binary
d_model: 32
seed: 42
backend: numpy              # ADR 0022 : numpy | torch | monai
modalities:
  attendues: ['tabulaire', 'imaging_2d', 'texte']
