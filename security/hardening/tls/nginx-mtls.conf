# NGINX mTLS — proxy TLS + vérification client pour HAPI FHIR (démonstration jalon R4)
# Le serveur exige un certificat client signé par la CA MEDISUITE
# (ssl_verify_client on) et force TLS 1.2+ avec suites modernes.
server {
    listen 8443 ssl;
    server_name hapi-fhir.medisuite.local;

    # Certificat serveur (généré par gen_certs.sh)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # mTLS : le client DOIT présenter un certificat de la CA interne
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Durcissement TLS (ASVS 9.1/9.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:medisuite:10m;

    # HSTS (bord HTTPS uniquement)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # FHIR uniquement (pas d'UI de test exposée)
    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Refus par défaut (moindre surface)
    location / { return 403; }
}
