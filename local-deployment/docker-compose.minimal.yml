# MEDISUITE — stack minimale locale v0.4 (services cœur + PACS + OHIF + FHIR HAPI + OTel)
# Usage : docker compose -f local-deployment/docker-compose.minimal.yml up
# Le PACS est un Orthanc OSS réel (image orthancteam, plugin DICOMweb PS3.18)
# configuré par local-deployment/orthanc/orthanc.json — voir docs/PACS-ORTHANC.md.
# Le référentiel central FHIR R4 est un HAPI JPA réel configuré par
# local-deployment/hapi/application.yaml — voir docs/FHIR-HAPI.md.
# La télémétrie OTel part vers un collecteur otel-collector-contrib —
# voir monitoring/otel/collector.yaml et docs/OTEL.md.
name: medisuite

x-service: &service
  build:
    context: ..
    dockerfile: local-deployment/Dockerfile.service
    args: {SERVICE_DIR: "services/${SERVICE_NAME}"}
  restart: unless-stopped
  depends_on: [orthanc-pacs]
  environment: &env
    MEDISUITE_ENV: local
    MEDISUITE_ORTHANC_URL: http://orthanc-pacs:8042
    MEDISUITE_ORTHANC_USER: medisuite
    MEDISUITE_ORTHANC_PASSWORD: medisuite-dev
    MEDISUITE_FHIR_BASE: http://hapi-fhir:8080/fhir
    MEDISUITE_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces

services:
  api-gateway: {<<: *service, ports: ["8000:8000"], environment: {<<: *env, SERVICE_NAME: api-gateway, SERVICE_PORT: 8000, SERVICE_MODULE: src.main:app}}
  auth-service: {<<: *service, ports: ["8001:8001"], environment: {<<: *env, SERVICE_NAME: auth-service, SERVICE_PORT: 8001, SERVICE_MODULE: src.main:app}}
  patient-service: {<<: *service, ports: ["8002:8002"], environment: {<<: *env, SERVICE_NAME: patient-service, SERVICE_PORT: 8002, SERVICE_MODULE: src.main:app}}
  imaging-service: {<<: *service, ports: ["8003:8003"], environment: {<<: *env, SERVICE_NAME: imaging-service, SERVICE_PORT: 8003, SERVICE_MODULE: src.main:app}}
  laboratory-service: {<<: *service, ports: ["8004:8004"], environment: {<<: *env, SERVICE_NAME: laboratory-service, SERVICE_PORT: 8004, SERVICE_MODULE: src.main:app}}

  # PACS réel — Orthanc OSS + DICOMweb (QIDO/WADO/STOW) + stockage persistant
  orthanc-pacs:
    image: orthancteam/orthanc:24.9
    restart: unless-stopped
    ports: ["8042:8042", "4242:4242"]
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db

  # Visualiseur OHIF v3 (v0.3) — branché sur /dicom-web via son nginx embarqué
  # qui proxifie orthanc-pacs:8042 (identifiants injectés côté serveur).
  # UI : http://localhost:3001 — lien profond : /viewer?StudyInstanceUIDs=<uid>
  ohif-viewer:
    build: ./ohif
    image: medisuite/ohif-viewer:0.3.0
    restart: unless-stopped
    ports: ["3001:80"]
    depends_on: [orthanc-pacs]

  # Référentiel FHIR R4 central (v0.4) — HAPI JPA réel sur PostgreSQL.
  # UI FHIR : http://localhost:8090 — API : http://localhost:8090/fhir/metadata
  hapi-fhir:
    image: hapiproject/hapi:latest
    restart: unless-stopped
    ports: ["8090:8080"]
    depends_on: [postgres-hapi]
    volumes:
      - ./hapi/application.yaml:/app/application.yaml:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"

  postgres-hapi:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi-dev
    volumes: ["hapi-data:/var/lib/postgresql/data"]

  # Collecteur OpenTelemetry (v0.4) — reçoit les spans OTLP/HTTP des 38
  # services et les expose en métriques Prometheus + log de debug.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    volumes:
      - ../monitoring/otel/collector.yaml:/etc/otel/collector.yaml:ro

  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes: ["../monitoring/prometheus:/etc/prometheus:ro"]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports: ["3000:3000"]

volumes:
  orthanc-data: {}
  hapi-data: {}
