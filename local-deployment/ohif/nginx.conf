# MEDISUITE — nginx embarqué du conteneur OHIF (v0.3)
#
# Rôle : servir l'application statique OHIF + proxifier les appels DICOMweb
# vers Orthanc en injectant l'authentification côté serveur. Le secret PACS
# reste dans le conteneur nginx : le navigateur n'envoie AUCUN identifiant.
# (En production, remplacer l'en-tête statique par une auth OAuth2 / plugin
# keycloak d'Orthanc — voir docs/OHIF-VIEWER.md §Sécurité.)

server {
  listen 80;
  server_name _;

  # ── Application OHIF (SPA) ────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # ── QIDO-RS / WADO-RS (PS3.18) → Orthanc ─────────────────────────────────
  location /dicom-web/ {
    proxy_pass http://orthanc-pacs:8042/dicom-web/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Identifiants injectés côté serveur (base64 medisuite:medisuite-dev)
    proxy_set_header Authorization "Basic bWVkaXN1aXRlOm1lZGlzdWl0ZS1kZXY=";
    proxy_read_timeout 300s;
    # STOW-RS / séries CT volumineuses
    client_max_body_size 4G;
  }

  # ── WADO-URI (images brutes) → Orthanc ───────────────────────────────────
  location /wado/ {
    proxy_pass http://orthanc-pacs:8042/wado/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "Basic bWVkaXN1aXRlOm1lZGlzdWl0ZS1kZXY=";
    proxy_read_timeout 300s;
    client_max_body_size 4G;
  }
}
